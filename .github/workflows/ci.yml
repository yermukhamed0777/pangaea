name: Verify PANGAEA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Tests and typecheck
        run: npm run typecheck && npm test
      - name: Benchmark (report only, no threshold)
        run: npm run bench
      - name: Static build
        run: npm run build
