name: Verify PANGAEA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # typecheck -> lint (warnings denied) -> tests -> eval -> event check ->
      # benchmark -> build -> offline check -> both basePath variants ->
      # browser e2e -> walkthrough fixtures. A red step stops the workflow,
      # and Pages deployment only runs after this workflow succeeds.
      - name: Full verification suite
        run: npm run verify
